name: Documentation links
on:
  push:
    branches: [main]
    paths: ['**/*.md', 'scripts/check_docs.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**/*.md', 'scripts/check_docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py
