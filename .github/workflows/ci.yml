name: Build and quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run existing test suite explicitly
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: devops-triage-wheel
          path: dist/*.whl
  test:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_tests) || (github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[skip tests]')) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: devops-triage --help
