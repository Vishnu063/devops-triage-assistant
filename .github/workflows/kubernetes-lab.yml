name: Disposable Kubernetes deep-diagnosis acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/operations-workflows]
    paths:
      - .github/workflows/kubernetes-lab.yml
      - triage/kubernetes.py
      - tests/test_live_kubernetes.py
permissions:
  contents: read
concurrency:
  group: kubernetes-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Create an owned disposable cluster
        run: |
          curl -fL --retry 2 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/triage-kind"
          chmod +x "$RUNNER_TEMP/triage-kind"
          "$RUNNER_TEMP/triage-kind" create cluster --name triage-lab --wait 120s
          docker pull busybox:1.37
          "$RUNNER_TEMP/triage-kind" load docker-image busybox:1.37 --name triage-lab
      - name: Exercise real Deployment, pod, event, configuration and Service reads
        run: python -m unittest discover -s tests -p test_live_kubernetes.py -v
        env:
          TRIAGE_RUN_K8S_LAB: '1'
      - name: Remove only the disposable cluster created by this job
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/triage-kind" ]; then
            "$RUNNER_TEMP/triage-kind" delete cluster --name triage-lab
          fi
